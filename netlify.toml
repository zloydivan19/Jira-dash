[build]
  publish = "dist"
  command = "npm run build"

[functions]
  directory = "netlify/functions"

# Proxy Jira API calls to the serverless function
[[redirects]]
  from = "/api/jira/*"
  to = "/.netlify/functions/jira-proxy"
  status = 200

# SPA fallback — all other routes serve index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
