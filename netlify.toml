[build]
  publish = "dist"
  command = "npm run build"

[functions]
  directory = "netlify/functions"

# Proxy Jira API calls to the serverless function
[[redirects]]
  from = "/api/jira/*"
  to = "/.netlify/functions/jira-proxy"
  status = 200

# Яндекс Диск пользователя (токен из браузера, на сервере не хранится)
[[redirects]]
  from = "/api/yadisk/*"
  to = "/.netlify/functions/yadisk-proxy/:splat"
  status = 200

# Confluence того же сайта Atlassian (выгрузка страниц в Word)
[[redirects]]
  from = "/api/confluence/*"
  to = "/.netlify/functions/confluence-proxy/:splat"
  status = 200

# SPA fallback — all other routes serve index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
