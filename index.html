<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jira PM Radar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        var t = 'dark';
        try {
          if (localStorage.getItem('jira_dash_theme_default') === '2' && localStorage.getItem('jira_dash_theme') === 'light') t = 'light';
        } catch (e) {}
        document.documentElement.dataset.theme = t;
        document.documentElement.style.background = t === 'dark' ? '#14161B' : '#FFFFFF';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
